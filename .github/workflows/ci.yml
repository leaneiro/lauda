name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # The toolbar's Liquid Glass needs the macOS 26 SDK. The image ships
      # Xcode 26 releases next to its default Xcode 16; take the newest.
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26.*.app | grep -vi -e beta -e release_candidate | sort -V | tail -1)"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Also compiles the string catalogs, so a broken translation fails here.
      - name: Build the app bundle
        run: Scripts/build-app.sh release

  # The app bundle is universal, but the job above only runs arm64 code.
  # This one builds and tests natively on an Intel Mac.
  test-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26.*.app | grep -vi -e beta -e release_candidate | sort -V | tail -1)"

      - name: Toolchain
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
